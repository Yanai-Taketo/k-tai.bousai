# 生成と2系統デプロイ(設計書§2〜§3)。
# 起動: Cloudflare Workerからのworkflow_dispatch(毎分、フィード更新検知時のみ)
#       + fallback-schedule.ymlからのdispatch(5分毎)。
# scheduleを本ファイルに置かない理由: 公開リポジトリでは60日間リポジトリ活動が無いと
# scheduledワークフローがファイル単位で自動無効化され、同居するworkflow_dispatch受け口まで
# 「Cannot trigger a workflow_dispatch on a disabled workflow」で道連れになるため
# (検証記録: docs/research/2026-08-14-trigger-verification.md)。
# 多重起動はconcurrencyで直列化(cancelしない: デプロイ中断を避ける)。
name: build-deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.ghp.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - name: 電文キャッシュ復元(電文は不変。取得量削減のみが目的で、無くても動く)
        uses: actions/cache@v4
        with:
          path: .cache
          key: telegrams-${{ github.run_id }}
          restore-keys: telegrams-

      - name: サイト生成
        run: python3 -m generator.main --site site --cache .cache

      - name: テスト(パーサ回帰)
        run: python3 -m unittest discover -s tests

      # トリガー判定はWorker上で動くため本ジョブでは使われないが、壊れても誰も
      # 気づかないまま更新頻度が静かに落ちる(2026-08-15の障害)。ここで毎回検査する。
      - name: テスト(トリガー判定ロジック)
        run: node --test worker/

      - name: GitHub Pages artifactアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesデプロイ
        id: ghp
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Cloudflare Pagesデプロイ(直接アップロード)
        id: cfp
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@4 pages deploy site --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true

      - name: 両系統とも失敗なら異常終了
        if: steps.ghp.outcome != 'success' && steps.cfp.outcome != 'success'
        run: |
          echo "::error::GitHub Pages・Cloudflare Pagesの両方のデプロイに失敗しました"
          exit 1
