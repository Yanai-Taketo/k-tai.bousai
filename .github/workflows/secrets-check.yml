# 一時: 公開前のSecrets/Variables設定検証(デプロイなし)。検証後に削除する。
name: secrets-check

on:
  push:
    branches: [claude/lightweight-disaster-site-research-y8frrn]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SITE_URLS: ${{ vars.SITE_URLS }}
    steps:
      - name: 設定値の形式確認
        run: |
          fail=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN が未設定"; fail=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID が未設定"; fail=1; }
          [ "$CF_PAGES_PROJECT" = "k-tai-bousai" ] || { echo "::error::Variable CF_PAGES_PROJECT が想定値でない: '$CF_PAGES_PROJECT'"; fail=1; }
          # SITE_URLSは各要素が https:// で始まること(コロン抜け等のタイポ検出)
          if [ -z "$SITE_URLS" ]; then
            echo "::error::Variable SITE_URLS が未設定"; fail=1
          else
            echo "$SITE_URLS" | tr ',' '\n' | while read -r u; do
              case "$u" in
                https://*) : ;;
                *) echo "::error::SITE_URLS の要素が不正(https:// で始まっていない): '$u'"; exit 1;;
              esac
            done || fail=1
          fi
          exit $fail

      - name: Cloudflareトークンの有効性確認(APIで直接)
        run: |
          r=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          code=$(echo "$r" | tail -1)
          if [ "$code" != "200" ]; then
            echo "::error::トークン検証に失敗 (HTTP $code)。トークンが無効か失効しています"
            echo "$r" | head -1 | sed 's/[a-zA-Z0-9_-]\{30,\}/***/g'
            exit 1
          fi
          echo "トークンは有効です"

      - name: Pagesプロジェクトへの到達確認(デプロイと同じ権限経路)
        run: |
          r=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          code=$(echo "$r" | tail -1)
          case "$code" in
            200) echo "Pagesプロジェクト '$CF_PAGES_PROJECT' に到達できました(デプロイ可能)";;
            403) echo "::error::権限不足。トークンに Account / Cloudflare Pages / Edit があるか確認してください"; exit 1;;
            404) echo "::error::プロジェクトが見つからない。CF_PAGES_PROJECT名かCLOUDFLARE_ACCOUNT_IDを確認してください"; exit 1;;
            *)   echo "::error::予期しない応答 (HTTP $code)"; exit 1;;
          esac
