# 一時: 公開前のSecrets/Variables設定検証(デプロイなし)。検証後に削除する。
name: secrets-check

on:
  push:
    branches: [claude/lightweight-disaster-site-research-y8frrn]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SITE_URLS: ${{ vars.SITE_URLS }}
    steps:
      - name: 設定値の存在確認
        run: |
          fail=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN が未設定"; fail=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID が未設定"; fail=1; }
          [ "$CF_PAGES_PROJECT" = "k-tai-bousai" ] || { echo "::error::Variable CF_PAGES_PROJECT が想定値でない: '$CF_PAGES_PROJECT'"; fail=1; }
          [ -n "$SITE_URLS" ] || { echo "::error::Variable SITE_URLS が未設定"; fail=1; }
          exit $fail
      - name: Cloudflare認証確認
        run: npx --yes wrangler@4 whoami
      - name: Pagesプロジェクト到達確認
        run: npx --yes wrangler@4 pages project list | grep -q k-tai-bousai && echo "Pagesプロジェクト OK"
